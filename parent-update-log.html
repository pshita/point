<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>היסטוריית עדכוני הורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EA;
    --ink:#22304A;
    --ink-soft:#4B5C79;
    --line:#D9D2BC;
    --gold:#B8902E;
    --gold-bg:#FBF1D9;
    --danger:#9C3B3B;
    --radius:10px;
  }
  * { box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
  }
  .wrap{
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1{
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 20px;
    margin: 0 0 16px;
  }
  .code-box{
    text-align: center;
    padding: 40px 16px;
  }
  .code-box input{
    display: block;
    margin: 14px auto 0;
    width: 160px;
    padding: 10px;
    text-align: center;
    font-size: 18px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }
  .code-box button{
    display: block;
    margin: 12px auto 0;
    padding: 10px 24px;
    border: none;
    border-radius: var(--radius);
    background: var(--gold);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .code-error{
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
  }
  .table-scroll{
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table.log-table{
    border-collapse: collapse;
    width: auto;
    table-layout: fixed;
  }
  table.log-table th{
    background: var(--gold-bg);
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 4px;
    border-bottom: 2px solid var(--gold);
    border-left: 1px solid var(--line);
    text-align: center;
    white-space: normal;
    line-height: 1.2;
  }
  table.log-table td{
    font-size: 13px;
    text-align: center;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line);
    overflow-wrap: break-word;
  }
  table.log-table th:first-child,
  table.log-table td:first-child{ border-left: none; }
  table.log-table tr:nth-child(even){ background: #FCFBF6; }
  table.links-table{
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 28px;
  }
  table.links-table th{
    background: var(--gold-bg);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 10px;
    border-bottom: 2px solid var(--gold);
    text-align: right;
  }
  table.links-table td{
    font-size: 13px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--line);
    text-align: right;
  }
  table.links-table tr:nth-child(even){ background: #FCFBF6; }
  table.links-table a{
    color: var(--ink);
    word-break: break-all;
  }
  .section-title{
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 17px;
    margin: 28px 0 10px;
  }
  .section-title:first-of-type{ margin-top: 0; }
  .loading, .empty, .err{
    text-align: center;
    color: var(--ink-soft);
    padding: 20px 0;
  }
  .err{ color: var(--danger); }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig, isFirebaseConfigured } from "./firebase-config.js";

const STORAGE_KEY = 'classroom-points-v1';
const FIRESTORE_COLLECTION = 'classroom_points';
const ACCESS_CODE = '963';

// Keep this list in sync with STUDENT_NAMES in index.html / parent-update.html.
const STUDENT_NAMES = [
  'צאלי', 'ישרוליק', 'נתנאל', 'מענדי ה.', 'מענדי ח.', 'אלעאי', 'יהונתן', 'איתן', 'מענדי ל.', 'שלוימי', 'מוישלה', 'לוי ס.',
  'שמוליק ע.', 'מולי', 'שלום', 'חננאל', 'שמוליק צ.', 'אושר', 'שמעון', 'מוטי', 'לוי ק.', 'נועם', 'משה'
];

// Keep these labels in sync with WEEKLY_PARENT_FIELD_DEFS in index.html.
const FIELD_LABELS = {
  chitas: 'חת"ת',
  shema: 'קריאת שמע',
  netilatYadaim: 'נטילת ידיים',
  minchaMaariv: 'מנחה מעריב',
  mikveh: 'מקווה שישי',
  dvarTorah: 'שיחה'
};
const FIELD_ORDER = ['chitas', 'shema', 'netilatYadaim', 'minchaMaariv', 'mikveh', 'dvarTorah'];
const LEAD_COL_WIDTHS = { student: 72, week: 80, when: 105 };

function fitHeaderCellToWidestWord(th){
  const label = th.dataset.fitLabel;
  if (!label) return;
  const words = label.split(' ');
  const cs = getComputedStyle(th);
  const span = document.createElement('span');
  span.style.position = 'fixed';
  span.style.top = '-9999px';
  span.style.whiteSpace = 'nowrap';
  span.style.fontFamily = cs.fontFamily;
  span.style.fontWeight = cs.fontWeight;
  span.style.fontSize = cs.fontSize;
  document.body.appendChild(span);
  let maxWordWidth = 0;
  words.forEach(w => {
    span.textContent = w;
    maxWordWidth = Math.max(maxWordWidth, span.getBoundingClientRect().width);
  });
  span.remove();
  const padding = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const border = (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.borderRightWidth) || 0);
  th.style.width = Math.ceil(maxWordWidth + padding + border + 4) + 'px';
}

const app = document.getElementById('app');

function showCodePrompt(){
  app.innerHTML = '';
  const h1 = document.createElement('h1');
  h1.textContent = 'היסטוריית עדכוני הורים';
  app.appendChild(h1);

  const box = document.createElement('div');
  box.className = 'code-box';
  const msg = document.createElement('div');
  msg.textContent = 'הזן קוד לצפייה:';
  box.appendChild(msg);
  const input = document.createElement('input');
  input.type = 'password';
  input.inputMode = 'numeric';
  box.appendChild(input);
  const errorEl = document.createElement('div');
  errorEl.className = 'code-error';
  box.appendChild(errorEl);
  const btn = document.createElement('button');
  btn.textContent = 'כניסה';
  box.appendChild(btn);
  app.appendChild(box);

  function trySubmit(){
    if (input.value.trim() === ACCESS_CODE){
      renderLog();
    } else {
      errorEl.textContent = 'קוד שגוי, נסה שוב';
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', trySubmit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') trySubmit(); });
  setTimeout(() => input.focus(), 50);
}

function buildLinksTable(){
  const table = document.createElement('table');
  table.className = 'links-table';

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  ['תלמיד', 'קישור אישי'].forEach(label => {
    const th = document.createElement('th');
    th.textContent = label;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  STUDENT_NAMES.forEach((name, idx) => {
    const id = idx + 1;
    const url = new URL('parent-update.html?id=' + id, location.href).href;
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    nameTd.textContent = name;
    tr.appendChild(nameTd);
    const linkTd = document.createElement('td');
    const a = document.createElement('a');
    a.href = url;
    a.textContent = url;
    a.target = '_blank';
    linkTd.appendChild(a);
    tr.appendChild(linkTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function buildLogTable(entries){
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'table-scroll';

  const table = document.createElement('table');
  table.className = 'log-table';

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  const leadCols = [
    { label: 'תלמיד', width: LEAD_COL_WIDTHS.student },
    { label: 'שבוע', width: LEAD_COL_WIDTHS.week },
    { label: 'תאריך ושעה', width: LEAD_COL_WIDTHS.when }
  ];
  leadCols.forEach(({ label, width }) => {
    const th = document.createElement('th');
    th.style.width = width + 'px';
    th.textContent = label;
    trh.appendChild(th);
  });
  FIELD_ORDER.forEach(key => {
    const th = document.createElement('th');
    th.dataset.fitLabel = FIELD_LABELS[key] || key;
    th.textContent = FIELD_LABELS[key] || key;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  entries.forEach(entry => {
    const when = new Date(entry.submittedAt);
    const whenStr = when.toLocaleDateString('he-IL') + ' ' + when.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    const v = entry.values || {};
    const tr = document.createElement('tr');
    const weekText = (entry.weekLabel || '').replace(/^פרשת\s+/, '');
    [entry.studentName || '', weekText, whenStr].forEach(text => {
      const td = document.createElement('td');
      td.textContent = text;
      tr.appendChild(td);
    });
    FIELD_ORDER.forEach(key => {
      const td = document.createElement('td');
      const val = v[key];
      td.textContent = typeof val === 'boolean' ? (val ? '✓' : '—') : (val !== undefined ? val : '');
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  scrollWrap.appendChild(table);
  return scrollWrap;
}

async function renderLog(){
  app.innerHTML = '';
  const h1 = document.createElement('h1');
  h1.textContent = 'היסטוריית עדכוני הורים';
  app.appendChild(h1);

  const linksTitle = document.createElement('div');
  linksTitle.className = 'section-title';
  linksTitle.textContent = 'קישורים אישיים לפי תלמיד';
  app.appendChild(linksTitle);
  app.appendChild(buildLinksTable());

  const logTitle = document.createElement('div');
  logTitle.className = 'section-title';
  logTitle.textContent = 'תשובות שהתקבלו';
  app.appendChild(logTitle);

  const status = document.createElement('div');
  status.className = 'loading';
  status.textContent = 'טוען…';
  app.appendChild(status);

  try{
    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);
    const logCollectionRef = collection(db, FIRESTORE_COLLECTION, STORAGE_KEY, 'parentUpdateLog');
    const q = query(logCollectionRef, orderBy('submittedAt', 'desc'), limit(200));
    const snaps = await getDocs(q);
    status.remove();
    if (snaps.empty){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'אין עדיין תשובות שהתקבלו.';
      app.appendChild(empty);
      return;
    }
    const entries = [];
    snaps.forEach(s => entries.push(s.data()));
    const logTableWrap = buildLogTable(entries);
    app.appendChild(logTableWrap);
    logTableWrap.querySelectorAll('th[data-fit-label]').forEach(fitHeaderCellToWidestWord);
  } catch(e){
    status.className = 'err';
    status.textContent = 'שגיאה בטעינת היסטוריית התשובות: ' + (e && e.message ? e.message : String(e));
  }
}

if (!isFirebaseConfigured){
  app.innerHTML = '<div class="err">האתר לא מוגדר עדיין.</div>';
} else {
  showCodePrompt();
}
</script>
</body>
</html>
