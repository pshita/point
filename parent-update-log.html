<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>היסטוריית עדכוני הורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EA;
    --ink:#22304A;
    --ink-soft:#4B5C79;
    --line:#D9D2BC;
    --gold:#B8902E;
    --gold-bg:#FBF1D9;
    --danger:#9C3B3B;
    --radius:10px;
  }
  * { box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
  }
  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1{
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 20px;
    margin: 0 0 16px;
  }
  .code-box{
    text-align: center;
    padding: 40px 16px;
  }
  .code-box input{
    display: block;
    margin: 14px auto 0;
    width: 160px;
    padding: 10px;
    text-align: center;
    font-size: 18px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }
  .code-box button{
    display: block;
    margin: 12px auto 0;
    padding: 10px 24px;
    border: none;
    border-radius: var(--radius);
    background: var(--gold);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .code-error{
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
  }
  .log-item{
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-soft);
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .log-item .log-when{
    font-weight: 700;
    color: var(--ink);
  }
  .loading, .empty, .err{
    text-align: center;
    color: var(--ink-soft);
    padding: 20px 0;
  }
  .err{ color: var(--danger); }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig, isFirebaseConfigured } from "./firebase-config.js";

const STORAGE_KEY = 'classroom-points-v1';
const FIRESTORE_COLLECTION = 'classroom_points';
const ACCESS_CODE = '963';

const FIELD_LABELS = {
  chitas: 'לימוד חת"ת',
  shema: 'קריאת שמע שעל המיטה',
  netilatYadaim: 'נטילת ידיים בבוקר על יד המיטה',
  minchaMaariv: 'תפילות מנחה וערבית במניין',
  mikveh: 'מקווה בערב שבת',
  dvarTorah: 'דבר תורה בסעודת שבת'
};
const FIELD_ORDER = ['chitas', 'shema', 'netilatYadaim', 'minchaMaariv', 'mikveh', 'dvarTorah'];

const app = document.getElementById('app');

function showCodePrompt(){
  app.innerHTML = '';
  const h1 = document.createElement('h1');
  h1.textContent = 'היסטוריית עדכוני הורים';
  app.appendChild(h1);

  const box = document.createElement('div');
  box.className = 'code-box';
  const msg = document.createElement('div');
  msg.textContent = 'הזן קוד לצפייה:';
  box.appendChild(msg);
  const input = document.createElement('input');
  input.type = 'password';
  input.inputMode = 'numeric';
  box.appendChild(input);
  const errorEl = document.createElement('div');
  errorEl.className = 'code-error';
  box.appendChild(errorEl);
  const btn = document.createElement('button');
  btn.textContent = 'כניסה';
  box.appendChild(btn);
  app.appendChild(box);

  function trySubmit(){
    if (input.value.trim() === ACCESS_CODE){
      renderLog();
    } else {
      errorEl.textContent = 'קוד שגוי, נסה שוב';
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', trySubmit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') trySubmit(); });
  setTimeout(() => input.focus(), 50);
}

function formatLogEntry(entry){
  const when = new Date(entry.submittedAt);
  const whenStr = when.toLocaleDateString('he-IL') + ' ' + when.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  const v = entry.values || {};
  const parts = FIELD_ORDER.map(key => {
    const label = FIELD_LABELS[key] || key;
    const val = v[key];
    if (typeof val === 'boolean') return label + ': ' + (val ? 'כן' : 'לא');
    return label + ': ' + val;
  });
  const row = document.createElement('div');
  row.className = 'log-item';
  const whenSpan = document.createElement('span');
  whenSpan.className = 'log-when';
  whenSpan.textContent = whenStr;
  row.appendChild(whenSpan);
  row.appendChild(document.createTextNode(' — ' + (entry.studentName || '') + ' — ' + (entry.weekLabel || '') + ' · ' + parts.join(', ')));
  return row;
}

async function renderLog(){
  app.innerHTML = '';
  const h1 = document.createElement('h1');
  h1.textContent = 'היסטוריית עדכוני הורים';
  app.appendChild(h1);

  const list = document.createElement('div');
  list.className = 'loading';
  list.textContent = 'טוען…';
  app.appendChild(list);

  try{
    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);
    const logCollectionRef = collection(db, FIRESTORE_COLLECTION, STORAGE_KEY, 'parentUpdateLog');
    const q = query(logCollectionRef, orderBy('submittedAt', 'desc'), limit(200));
    const snaps = await getDocs(q);
    list.className = '';
    list.innerHTML = '';
    if (snaps.empty){
      list.className = 'empty';
      list.textContent = 'אין עדיין תשובות שהתקבלו.';
      return;
    }
    snaps.forEach(s => list.appendChild(formatLogEntry(s.data())));
  } catch(e){
    list.className = 'err';
    list.textContent = 'שגיאה בטעינת היסטוריית התשובות: ' + (e && e.message ? e.message : String(e));
  }
}

if (!isFirebaseConfigured){
  app.innerHTML = '<div class="err">האתר לא מוגדר עדיין.</div>';
} else {
  showCodePrompt();
}
</script>
</body>
</html>
