<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הנוסע המתמיד - עדכון הורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EA;
    --ink:#22304A;
    --ink-soft:#4B5C79;
    --line:#D9D2BC;
    --gold:#B8902E;
    --gold-bg:#FBF1D9;
    --green:#2E7D4F;
    --green-bg:#E3F3E9;
    --danger:#9C3B3B;
    --danger-bg:#F5E4E1;
    --radius:10px;
  }
  * { box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1{
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .intro{
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
    background: var(--gold-bg);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin: 14px 0;
  }
  .field{
    margin: 18px 0;
  }
  .field label{
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
  }
  select{
    width: 100%;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    font-family: 'Rubik', sans-serif;
    font-size: 15px;
    background: #fff;
  }
  .slider-row{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  input[type="range"]{
    flex: 1;
  }
  .slider-val{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--gold);
    min-width: 28px;
    text-align: center;
  }
  .checkbox-row{
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .checkbox-row input{
    width: 22px;
    height: 22px;
  }
  .submit-btn{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    background: var(--gold);
    color: #fff;
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
  }
  .submit-btn:active{ transform: scale(0.98); }
  .status-msg{
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
    min-height: 20px;
  }
  .status-msg.ok{ color: var(--green); }
  .status-msg.err{ color: var(--danger); }
  .error-box{
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 20px;
    font-size: 15px;
    line-height: 1.6;
    text-align: center;
  }
  .loading{
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 0;
  }
  .log-section{
    margin-top: 30px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .log-title{
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .log-item{
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-soft);
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  .log-item .log-when{
    font-weight: 600;
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading">טוען…</div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, runTransaction, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig, isFirebaseConfigured } from "./firebase-config.js";

// Keep this list in sync with STUDENT_NAMES in index.html.
const STUDENT_NAMES = [
  'צאלי', 'ישרוליק', 'נתנאל', 'מענדי ה.', 'מענדי ח.', 'אלעאי', 'יהונתן', 'איתן', 'מענדי ל.', 'שלוימי', 'מוישלה', 'לוי ס.',
  'שמוליק ע.', 'מולי', 'שלום', 'חננאל', 'שמוליק צ.', 'אושר', 'שמעון', 'מוטי', 'לוי ק.', 'נועם', 'משה'
];
const TOTAL_STUDENTS = STUDENT_NAMES.length;
const STORAGE_KEY = 'classroom-points-v1';
const FIRESTORE_COLLECTION = 'classroom_points';

// Sunday of the week this form launched. The week picker never offers
// anything earlier than this - there is no data to report before it existed.
const LAUNCH_WEEK_START = '2026-10-04';

function getWeekStart(date){
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}

function dateKey(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

const FIELDS = [
  { key: 'chitas', label: 'לימוד חת"ת', kind: 'slider' },
  { key: 'shema', label: 'קריאת שמע שעל המיטה', note: 'אחרי בר מצווה, עם כובע וחליפה', kind: 'slider' },
  { key: 'netilatYadaim', label: 'נטילת ידיים בבוקר על יד המיטה', kind: 'slider' },
  { key: 'minchaMaariv', label: 'תפילות מנחה וערבית במניין', note: 'ושחרית בזמני חופשה', kind: 'slider' },
  { key: 'mikveh', label: 'מקווה בערב שבת', kind: 'checkbox' },
  { key: 'dvarTorah', label: 'דבר תורה בסעודת שבת', kind: 'checkbox' }
];

const app = document.getElementById('app');

function showError(msg){
  app.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'error-box';
  box.textContent = msg;
  app.appendChild(box);
}

async function fetchParshaNames(weeks){
  if (weeks.length === 0) return;
  const start = weeks[0].weekStart;
  const end = new Date(weeks[weeks.length - 1].weekStart);
  end.setDate(end.getDate() + 6);
  try{
    const url = 'https://www.hebcal.com/hebcal?cfg=json&v=1&maj=off&min=off&mod=off&nx=off&mf=off&ss=off&s=on&i=on&geo=none'
      + '&start=' + dateKey(start) + '&end=' + dateKey(end);
    const res = await fetch(url);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    const items = Array.isArray(data.items) ? data.items : [];
    weeks.forEach(w => {
      const sat = new Date(w.weekStart);
      sat.setDate(sat.getDate() + 6);
      const satKey = dateKey(sat);
      const match = items.find(it => it.category === 'parashat' && String(it.date || '').slice(0, 10) === satKey);
      if (match) w.parsha = match.hebrew || match.title;
    });
  } catch(e){
    // Best-effort only; weeks without a resolved name fall back to a date label.
  }
}

function weekLabel(w){
  if (w.parsha) return w.parsha;
  return 'שבוע ' + dateKey(w.weekStart);
}

async function main(){
  if (!isFirebaseConfigured){
    showError('האתר לא מוגדר עדיין. יש לפנות למורה.');
    return;
  }

  const params = new URLSearchParams(location.search);
  let studentId = parseInt(params.get('id'), 10);
  if (!studentId || studentId < 1 || studentId > TOTAL_STUDENTS) studentId = 1;

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);
  const stateDocRef = doc(db, FIRESTORE_COLLECTION, STORAGE_KEY);

  const weeks = [];
  const launchStart = new Date(LAUNCH_WEEK_START + 'T00:00:00');
  const thisWeekStart = getWeekStart(new Date());
  for (let d = new Date(launchStart); d <= thisWeekStart; d.setDate(d.getDate() + 7)){
    weeks.push({ weekStart: new Date(d), weekKey: dateKey(d), parsha: null });
  }
  await fetchParshaNames(weeks);

  let remoteData = null;
  try{
    const snap = await getDoc(stateDocRef);
    if (snap.exists()) remoteData = snap.data();
  } catch(e){
    showError('שגיאה בטעינת הנתונים. נסו לרענן את העמוד.');
    return;
  }

  renderForm(studentId, weeks, remoteData, db, stateDocRef);
}

function findStudentRecord(remoteData, weekKey, studentId){
  if (!remoteData || !Array.isArray(remoteData.archive)) return null;
  const entry = remoteData.archive.find(e => e.type === 'weekly' && e.weekKey === weekKey);
  if (!entry || !Array.isArray(entry.students)) return null;
  return entry.students.find(s => s.id === studentId) || null;
}

function renderForm(initialStudentId, weeks, remoteData, db, stateDocRef){
  app.innerHTML = '';

  const defaultWeekIdx = weeks.length > 1 ? weeks.length - 2 : 0;

  const h1 = document.createElement('h1');
  h1.textContent = '"הנוסע המתמיד" - עדכון הורים';
  app.appendChild(h1);

  const intro = document.createElement('div');
  intro.className = 'intro';
  intro.textContent = 'הורה יקר, מילוי המשימות חשוב מאוד, כדי שבנכם יתקדם ביראת שמים והנהגה חסידית.';
  app.appendChild(intro);

  const nameField = document.createElement('div');
  nameField.className = 'field';
  const nameSelect = document.createElement('select');
  STUDENT_NAMES.forEach((name, idx) => {
    const opt = document.createElement('option');
    opt.value = String(idx + 1);
    opt.textContent = name;
    nameSelect.appendChild(opt);
  });
  nameSelect.value = String(initialStudentId);
  nameField.appendChild(nameSelect);
  app.appendChild(nameField);

  const weekField = document.createElement('div');
  weekField.className = 'field';
  const weekSelect = document.createElement('select');
  weeks.forEach((w, idx) => {
    const opt = document.createElement('option');
    opt.value = String(idx);
    opt.textContent = weekLabel(w);
    weekSelect.appendChild(opt);
  });
  weekSelect.selectedIndex = defaultWeekIdx;
  weekField.appendChild(weekSelect);
  app.appendChild(weekField);

  function currentStudentId(){
    return parseInt(nameSelect.value, 10);
  }

  const inputs = {};
  FIELDS.forEach(f => {
    const field = document.createElement('div');
    field.className = 'field';
    if (f.kind === 'slider'){
      const label = document.createElement('label');
      label.textContent = f.label;
      if (f.note){
        const noteEl = document.createElement('span');
        noteEl.style.fontWeight = '400';
        noteEl.style.fontSize = '0.8em';
        noteEl.style.color = 'var(--ink-soft)';
        noteEl.textContent = ' ' + f.note;
        label.appendChild(noteEl);
      }
      field.appendChild(label);
      const row = document.createElement('div');
      row.className = 'slider-row';
      const range = document.createElement('input');
      range.type = 'range';
      range.min = '1';
      range.max = '7';
      range.step = '1';
      range.value = '7';
      const valSpan = document.createElement('span');
      valSpan.className = 'slider-val';
      valSpan.textContent = range.value;
      range.addEventListener('input', () => { valSpan.textContent = range.value; });
      row.appendChild(range);
      row.appendChild(valSpan);
      field.appendChild(row);
      inputs[f.key] = range;
    } else {
      const row = document.createElement('label');
      row.className = 'checkbox-row';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      row.appendChild(cb);
      const span = document.createElement('span');
      span.textContent = f.label;
      row.appendChild(span);
      field.appendChild(row);
      inputs[f.key] = cb;
    }
    app.appendChild(field);
  });

  function loadValuesForWeek(){
    const w = weeks[weekSelect.selectedIndex];
    const rec = findStudentRecord(remoteData, w.weekKey, currentStudentId());
    FIELDS.forEach(f => {
      if (f.kind === 'slider'){
        const v = rec && typeof rec[f.key] === 'number' ? rec[f.key] : 7;
        inputs[f.key].value = String(v);
        inputs[f.key].nextSibling.textContent = String(v);
      } else {
        inputs[f.key].checked = rec && typeof rec[f.key] === 'boolean' ? rec[f.key] : true;
      }
    });
  }
  loadValuesForWeek();

  weekSelect.addEventListener('change', loadValuesForWeek);
  nameSelect.addEventListener('change', loadValuesForWeek);

  const submitBtn = document.createElement('button');
  submitBtn.type = 'button';
  submitBtn.className = 'submit-btn';
  submitBtn.textContent = 'שליחה';
  app.appendChild(submitBtn);

  const statusMsg = document.createElement('div');
  statusMsg.className = 'status-msg';
  app.appendChild(statusMsg);

  const logSection = document.createElement('div');
  logSection.className = 'log-section';
  const logTitle = document.createElement('div');
  logTitle.className = 'log-title';
  logTitle.textContent = 'תשובות שנשלחו';
  logSection.appendChild(logTitle);
  const logList = document.createElement('div');
  logSection.appendChild(logList);
  app.appendChild(logSection);

  const logCollectionRef = collection(db, FIRESTORE_COLLECTION, STORAGE_KEY, 'parentUpdateLog');

  function formatLogEntry(entry){
    const when = new Date(entry.submittedAt);
    const whenStr = when.toLocaleDateString('he-IL') + ' ' + when.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    const v = entry.values || {};
    const parts = FIELDS.map(f => {
      const val = v[f.key];
      if (f.kind === 'checkbox') return f.label + ': ' + (val ? 'כן' : 'לא');
      return f.label + ': ' + val;
    });
    return whenStr + ' — ' + (entry.studentName || '') + ' — ' + (entry.weekLabel || '') + ' · ' + parts.join(', ');
  }

  async function renderLog(){
    logList.textContent = 'טוען…';
    try{
      const q = query(logCollectionRef, orderBy('submittedAt', 'desc'), limit(50));
      const snaps = await getDocs(q);
      logList.innerHTML = '';
      if (snaps.empty){
        logList.textContent = 'אין עדיין תשובות שנשלחו.';
        return;
      }
      snaps.forEach(s => {
        const row = document.createElement('div');
        row.className = 'log-item';
        row.textContent = formatLogEntry(s.data());
        logList.appendChild(row);
      });
    } catch(e){
      logList.textContent = 'שגיאה בטעינת היסטוריית התשובות.';
    }
  }
  renderLog();

  submitBtn.addEventListener('click', async () => {
    submitBtn.disabled = true;
    statusMsg.className = 'status-msg';
    statusMsg.textContent = 'שולח…';
    const w = weeks[weekSelect.selectedIndex];
    const submitStudentId = currentStudentId();
    const values = {};
    FIELDS.forEach(f => {
      values[f.key] = f.kind === 'slider' ? parseInt(inputs[f.key].value, 10) : !!inputs[f.key].checked;
    });

    try{
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(stateDocRef);
        if (!snap.exists()) throw new Error('לא נמצאו נתונים באתר');
        const body = snap.data();
        if (!Array.isArray(body.archive)) body.archive = [];
        let weeklyEntry = body.archive.find(e => e.type === 'weekly' && e.weekKey === w.weekKey);
        if (!weeklyEntry){
          weeklyEntry = {
            type: 'weekly',
            title: 'הנוסע המתמיד',
            weekKey: w.weekKey,
            weekStart: w.weekStart.toISOString(),
            date: w.weekStart.toISOString(),
            students: []
          };
          body.archive.unshift(weeklyEntry);
        }
        if (!Array.isArray(weeklyEntry.students)) weeklyEntry.students = [];
        let studentRec = weeklyEntry.students.find(s => s.id === submitStudentId);
        if (!studentRec){
          studentRec = { id: submitStudentId, morning: 0, tefila: 0, mikve: 0, minusDelta: 0, bonus: 0, days: {} };
          weeklyEntry.students.push(studentRec);
        }
        Object.assign(studentRec, values);
        if (w.parsha) weeklyEntry.weekParsha = w.parsha;
        tx.set(stateDocRef, body);
      });
      try{
        await addDoc(logCollectionRef, {
          studentId: submitStudentId,
          studentName: STUDENT_NAMES[submitStudentId - 1] || String(submitStudentId),
          weekKey: w.weekKey,
          weekLabel: weekLabel(w),
          values,
          submittedAt: new Date().toISOString()
        });
      } catch(e){
        // The log is a nice-to-have; never fail the submission because of it.
      }
      renderLog();
      statusMsg.className = 'status-msg ok';
      statusMsg.textContent = 'התשובות נשלחו בהצלחה, תודה!';
    } catch(e){
      statusMsg.className = 'status-msg err';
      statusMsg.textContent = 'שגיאה בשליחה: ' + (e && e.message ? e.message : String(e));
    } finally {
      submitBtn.disabled = false;
    }
  });
}

main();
</script>
</body>
</html>
